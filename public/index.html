<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chat Platform</title><link rel="stylesheet" href="/style.css"><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#5865f2"></head><body><div id="toast"></div><section id="auth" class="auth"><div class="auth-card"><div class="logo">◈ Chat Platform</div><p class="muted">Real-time Group Chat + Files + Webhook</p><div class="tabs"><button id="tabLogin" class="active">เข้าสู่ระบบ</button><button id="tabRegister">สมัครสมาชิก</button></div><form id="authForm"><input id="username" placeholder="Username" autocomplete="username" required><input id="displayName" class="hidden" placeholder="ชื่อแสดงผล" autocomplete="name"><input id="password" type="password" placeholder="Password (อย่างน้อย 8 ตัว)" autocomplete="current-password" required><button class="primary" id="authBtn">เข้าสู่ระบบ</button></form></div></section><section id="app" class="app hidden"><aside class="servers"><div class="server-title">GROUPS</div><div id="groupList"></div><button class="round" id="addGroup">+</button></aside><aside class="channels"><div class="side-head"><b id="groupName">เลือกกลุ่ม</b><button id="groupMenu">⋮</button></div><div class="section-label">CHANNELS <button id="addChannel">+</button></div><div id="channelList"></div><div class="side-bottom"><div class="me"><div class="avatar" id="meAvatar">U</div><div><b id="meName"></b><small id="meUser"></small></div><button id="logout">↪</button></div></div></aside><main class="chat"><header class="chat-head"><div><b id="channelTitle"># general</b><span id="typing"></span></div><div class="head-actions"><button id="notifyBtn">🔔 <span id="unread">0</span></button><button id="webhookBtn">🔗 Webhook</button><button id="membersBtn">👥</button></div></header><div id="messages" class="messages"></div><div id="filePreview" class="file-preview hidden"><div class="file-preview-head"><b>ไฟล์ที่เตรียมส่ง</b><span>สูงสุด 10 ไฟล์ • 25 MB/ไฟล์</span><button type="button" id="cancelFiles">ยกเลิกทั้งหมด</button></div><div id="filePreviewList" class="file-preview-list"></div></div><form id="composer" class="composer"><input type="file" id="fileInput" multiple hidden><button type="button" id="fileBtn">📎</button><input id="messageInput" autocomplete="off" placeholder="พิมพ์ข้อความ... @username • ลากไฟล์มาวางได้"><button class="send">ส่ง</button></form></main></section><div id="modal" class="modal hidden"><div class="modal-card"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});</script></body></html>
